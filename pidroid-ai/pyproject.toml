[project]
name = "pidroid-ai"
version = "0.1.0"
description = "Pidroid service for providing AI related tasks such as scam image detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "faststream[rabbit]>=0.7.1",
    "pidroid-core",
    "pillow>=12.2.0",
    "protobuf>=7.35.0",
    "sentence-transformers>=5.5.1",
    "sentencepiece>=0.2.1",

    # for testing right now
    "chromadb>=1.5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pidroid_ai"]

[tool.uv.sources]
pidroid-core = { path = "../pidroid-core", editable = true }
