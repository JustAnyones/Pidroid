name: Build and push the Docker image to ghcr.io

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false

    - name: Build the Docker image and tag it
      run: ./build.sh

    - name: Login to ghcr.io
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u $ --password-stdin

    - name: Push to ghcr.io
      run: docker image push --all-tags ghcr.io/justanyones/pidroid
